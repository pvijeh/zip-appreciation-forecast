[project]
name = "zipforecast"
version = "0.1.0"
description = "Rank NYC-metro ZIP codes by expected 5- and 10-year home price appreciation, from a national ZIP panel of Zillow and Census data."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "pyarrow>=17,<22",
    "scikit-learn>=1.5,<2",
    "scipy>=1.14,<2",
]

[project.scripts]
zipforecast = "zipforecast.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.8,<1",
    "pytest>=8,<9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
